<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学習ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f9;
    --ink: #1c2333;
    --muted: #5a6477;
    --rule: #d8dde6;
    --accent: #0e6b6b;
    --accent-ink: #ffffff;
    --error: #b3261e;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12161f;
      --ink: #e8ebf2;
      --muted: #98a2b5;
      --rule: #2b3342;
      --accent: #4fc3c3;
      --accent-ink: #0b1a1a;
      --error: #ff8a80;
      --field: #1a2030;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.75;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .lead { margin: 0 0 32px; color: var(--muted); }

  form { display: grid; gap: 14px; margin-bottom: 8px; }
  label { display: grid; gap: 4px; font-weight: 500; font-size: 0.95rem; }
  input, textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 10px 12px;
  }
  textarea { min-height: 112px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .count { justify-self: end; font-size: 0.8rem; color: var(--muted); font-weight: 400; }
  button {
    justify-self: start;
    font: inherit;
    font-weight: 700;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 10px 22px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: progress; }
  .status { min-height: 1.75em; margin: 0 0 32px; font-size: 0.92rem; color: var(--muted); }
  .status.error { color: var(--error); }

  h2 { margin: 0 0 12px; font-size: 1.1rem; font-weight: 700; }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  li {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    column-gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
  }
  .when { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .who { font-weight: 700; margin-bottom: 2px; }
  .what { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 20px 0; color: var(--muted); }
  @media (max-width: 480px) {
    li { grid-template-columns: 1fr; }
    .when { margin-bottom: 4px; }
  }
</style>
</head>
<body>
<main>
  <h1>学習ログ</h1>
  <p class="lead">今日やったことを、ひとこと残す。</p>

  <form id="form">
    <label>
      名前
      <input id="name" maxlength="30" autocomplete="nickname" required>
    </label>
    <label>
      今日やったこと
      <textarea id="content" maxlength="500" required></textarea>
      <span class="count"><span id="counter">0</span> / 500</span>
    </label>
    <button id="submit" type="submit">投稿する</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite"></p>

  <h2>みんなの学習ログ</h2>
  <ol id="list"></ol>
</main>

<script>
  // デプロイ後、CloudFormationの出力 ApiUrl に書き換える(末尾にスラッシュは付けない)
  const API_URL = "YOUR_API_URL";

  const form = document.getElementById("form");
  const nameEl = document.getElementById("name");
  const contentEl = document.getElementById("content");
  const counterEl = document.getElementById("counter");
  const submitEl = document.getElementById("submit");
  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("list");

  function setStatus(message, isError) {
    statusEl.textContent = message;
    statusEl.className = "status" + (isError ? " error" : "");
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleString("ja-JP", {
      timeZone: "Asia/Tokyo",
      month: "numeric",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
  }

  function render(items) {
    listEl.replaceChildren();
    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "まだ投稿がありません。最初の1件を書いてみましょう。";
      listEl.appendChild(empty);
      return;
    }
    for (const item of items) {
      const li = document.createElement("li");

      const when = document.createElement("div");
      when.className = "when";
      when.textContent = formatDate(item.createdAt);

      const body = document.createElement("div");
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = item.name;
      const what = document.createElement("p");
      what.className = "what";
      what.textContent = item.content;
      body.append(who, what);

      li.append(when, body);
      listEl.appendChild(li);
    }
  }

  async function loadLogs() {
    try {
      const res = await fetch(API_URL + "/logs");
      if (!res.ok) throw new Error("status " + res.status);
      render(await res.json());
    } catch (err) {
      console.error(err);
      setStatus("一覧を読み込めませんでした。ページを再読み込みしてください。", true);
    }
  }

  contentEl.addEventListener("input", () => {
    counterEl.textContent = contentEl.value.length;
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    submitEl.disabled = true;
    setStatus("投稿しています…", false);
    try {
      const res = await fetch(API_URL + "/logs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: nameEl.value.trim(),
          content: contentEl.value.trim(),
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.message || "status " + res.status);
      }
      contentEl.value = "";
      counterEl.textContent = "0";
      setStatus("投稿しました。", false);
      await loadLogs();
    } catch (err) {
      console.error(err);
      setStatus("投稿できませんでした:" + err.message, true);
    } finally {
      submitEl.disabled = false;
    }
  });

  loadLogs();
</script>
</body>
</html>
