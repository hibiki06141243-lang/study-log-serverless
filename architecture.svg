<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">学習ログ 構成図</title>
  <desc id="d">ブラウザがCloudFront経由でS3の画面を取得し、API Gatewayを呼び出す。API Gatewayは2つのLambdaを呼び、LambdaがDynamoDBを読み書きする。Lambdaのエラーは CloudWatchアラームとSNSでメール通知される。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3b4558"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#b3261e"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; fill: #1c2333; }
    .box { fill: #eef3f8; stroke: #3b4558; stroke-width: 1.5; }
    .t { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .s { font-size: 12px; text-anchor: middle; fill: #4a5568; }
    .l { font-size: 13px; fill: #1c2333; }
    .n { font-size: 12px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
    .line { stroke: #3b4558; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .join { stroke: #3b4558; stroke-width: 1.5; fill: none; }
    .alarm { stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#r); }
    .badge { fill: #0e6b6b; }
  </style>
  <rect width="960" height="650" fill="#ffffff"/>

  <!-- CloudFormation の枠 -->
  <rect x="230" y="28" width="715" height="490" rx="10" fill="none" stroke="#0e6b6b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="244" y="50" class="l" style="font-weight:700">CloudFormation(template.yaml)で一括管理</text>

  <!-- ボックス -->
  <rect class="box" x="20" y="202" width="170" height="56" rx="8"/>
  <text class="t" x="105" y="226">ブラウザ</text><text class="s" x="105" y="245">学習ログの画面</text>

  <rect class="box" x="250" y="70" width="170" height="56" rx="8"/>
  <text class="t" x="335" y="94">CloudFront</text><text class="s" x="335" y="113">HTTPSで配信</text>

  <rect class="box" x="520" y="70" width="170" height="56" rx="8"/>
  <text class="t" x="605" y="94">S3(非公開)</text><text class="s" x="605" y="113">index.html を保管</text>

  <rect class="box" x="250" y="202" width="170" height="56" rx="8"/>
  <text class="t" x="335" y="226">API Gateway</text><text class="s" x="335" y="245">HTTP API: GET・POST /logs</text>

  <rect class="box" x="520" y="150" width="170" height="56" rx="8"/>
  <text class="t" x="605" y="174">createStudyLog</text><text class="s" x="605" y="193">Lambda(PutItemのみ許可)</text>

  <rect class="box" x="520" y="254" width="170" height="56" rx="8"/>
  <text class="t" x="605" y="278">getStudyLogs</text><text class="s" x="605" y="297">Lambda(Queryのみ許可)</text>

  <rect class="box" x="765" y="202" width="170" height="56" rx="8"/>
  <text class="t" x="850" y="226">DynamoDB</text><text class="s" x="850" y="245">pk+createdAt・オンデマンド</text>

  <rect class="box" x="520" y="420" width="170" height="56" rx="8"/>
  <text class="t" x="605" y="444">CloudWatch アラーム</text><text class="s" x="605" y="463">Lambdaのエラーを監視</text>

  <rect class="box" x="765" y="420" width="170" height="56" rx="8"/>
  <text class="t" x="850" y="444">SNS</text><text class="s" x="850" y="463">メールで通知</text>

  <!-- 矢印 -->
  <path class="line" d="M190 230 H215 V98 H250"/>
  <path class="line" d="M190 230 H250"/>
  <path class="line" d="M420 98 H520"/>
  <text class="s" x="470" y="90">OAC</text>
  <path class="line" d="M420 230 H470 V178 H520"/>
  <path class="join" d="M470 230 V282 H520"/>
  <path class="line" d="M690 178 H727 V230 H765"/>
  <path class="join" d="M690 282 H727 V230"/>
  <path class="line" d="M690 448 H765"/>
  <path class="alarm" d="M605 420 V310"/>

  <!-- 番号 -->
  <circle class="badge" cx="232" cy="98" r="11"/><text class="n" x="232" y="102">1</text>
  <circle class="badge" cx="220" cy="230" r="11"/><text class="n" x="220" y="234">2</text>
  <circle class="badge" cx="727" cy="230" r="11"/><text class="n" x="727" y="234">3</text>
  <circle class="badge" cx="605" cy="365" r="11"/><text class="n" x="605" y="369">4</text>

  <!-- 凡例 -->
  <text class="l" x="20" y="556"><tspan font-weight="700">1</tspan>  画面(index.html)をCloudFront経由で取得。S3は非公開で、CloudFrontからだけ読める</text>
  <text class="l" x="20" y="580"><tspan font-weight="700">2</tspan>  画面から投稿・一覧のAPIを呼び出す。CORSは自分のCloudFrontのURLだけ許可</text>
  <text class="l" x="20" y="604"><tspan font-weight="700">3</tspan>  機能ごとに分けた最小権限のLambdaが、DynamoDBを読み書きする</text>
  <text class="l" x="20" y="628"><tspan font-weight="700">4</tspan>  Lambdaのエラーをアラームで検知し、メールで通知する</text>
</svg>
